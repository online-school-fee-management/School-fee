{% extends "base.html" %}
{% block title %}Change password{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 460px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-1">Change password</h4>
      <p class="text-muted small">{{ request.user.first_name|default:request.user.username }} · {{ request.user.username }}</p>

      {% for e in errors %}<div class="alert alert-danger py-2">{{ e }}</div>{% endfor %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Current password</label>
          <input type="password" name="current_password" class="form-control" autocomplete="current-password" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">New password <span class="text-muted small">(min 8 characters)</span></label>
          <input type="password" name="new_password" class="form-control" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm new password</label>
          <input type="password" name="confirm_password" class="form-control" minlength="8" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" type="submit">Change password</button>
        <a class="btn btn-light" href="{% url 'accounts:home' %}">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
